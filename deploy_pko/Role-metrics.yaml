apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certman-operator-metrics
  namespace: certman-operator
  annotations:
    package-operator.run/phase: rbac
    package-operator.run/collision-protection: IfNoController
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - create
  - update
  - delete
