apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: certman-operator
rules:
# secrets access is cluster-scoped, not restricted to Hive-managed cluster
# namespaces: the controller reads/writes secrets via mgr.GetClient(), whose
# cache requires list+watch to sync before any Get() succeeds (a ClusterRole
# with only get/create/update breaks it - see rosaeng-61300-rbac-verification.md).
# list/watch/create/update/patch cannot be scoped to "Hive-managed namespaces"
# with plain RBAC: those namespaces are created dynamically per-cluster, so
# there's no static namespace list or resourceName to restrict against.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - get
  - create
- apiGroups:
  - certman.managed.openshift.io
  resources:
  - '*'
  - certificaterequests
  verbs:
  - '*'
- apiGroups:
  - hive.openshift.io
  attributeRestrictions: null
  resources:
  - clusterdeployments
  - clusterdeployments/finalizers
  - clusterdeployments/status
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - '*'
- apiGroups:
  - aws.managed.openshift.io
  resources:
  - accountclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hive.openshift.io
  resources:
  - dnszones
  verbs:
  - get
  - list
  - watch